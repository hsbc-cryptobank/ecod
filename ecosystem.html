<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECODUNE Ecosystem — 40+ Tokens</title>
<link rel="icon" href="ecodune_logo.png">
<style>
:root{--bg:#040906;--text:#E0F0E6;--green:#2ECC40;--dark:#1B8A2A;--gold:#FFD700;--glass:rgba(10,25,15,0.6);--border:rgba(46,204,64,0.25);--muted:#8A94C8;--card-text:#C0C8F0;--header-bg:rgba(4,9,6,0.9)}
[data-theme="light"]{--bg:#F5F7F2;--text:#1A2A1E;--green:#1B8A2A;--dark:#2ECC40;--gold:#B8860B;--glass:rgba(255,255,255,0.7);--border:rgba(27,138,42,0.25);--muted:#5A6A5E;--card-text:#2A3A2E;--header-bg:rgba(245,247,242,0.9)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-top:100px;padding-bottom:60px;transition:background .4s,color .4s}
.container{max-width:1300px;margin:0 auto;padding:0 20px}
header{position:fixed;top:0;left:0;width:100%;background:var(--header-bg);backdrop-filter:blur(12px);z-index:100;border-bottom:1px solid var(--border);padding:12px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;max-width:1300px;margin:0 auto;padding:0 20px}
.logo{display:flex;align-items:center;gap:8px}
.logo img{height:36px;border-radius:50%}
.logo-text{font-size:20px;font-weight:700;color:var(--text)}
nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500}
nav a:hover{color:var(--green)}
nav a.active{color:var(--green);border-bottom:2px solid var(--green)}
.btn-primary{background:linear-gradient(135deg,var(--green),var(--dark));color:#040906;padding:8px 20px;border-radius:30px;font-weight:700;text-decoration:none;border:none;cursor:pointer;display:inline-block}
[data-theme="light"] .btn-primary{color:#fff}
.theme-toggle{background:var(--glass);border:1px solid var(--border);color:var(--text);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px}
.section-header{text-align:center;margin:30px 0}
.section-header h1{font-size:38px;font-weight:800;color:var(--text)}
.section-header h1 .highlight{color:var(--green)}
.section-header p{color:var(--muted);max-width:800px;margin:0 auto}
.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:20px 0}
.controls input,.controls select{padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-size:14px;min-width:200px}
.controls input:focus,.controls select:focus{outline:none;border-color:var(--green)}
.sector-block{background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:24px;backdrop-filter:blur(15px)}
.sector-title{font-size:20px;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px}
.sector-title span{font-size:24px}
.token-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.token-card{background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:14px;padding:16px;text-decoration:none;color:var(--card-text);transition:.3s;display:flex;flex-direction:column;gap:4px}
[data-theme="light"] .token-card{background:rgba(255,255,255,0.6)}
.token-card:hover{border-color:var(--green);transform:translateY(-3px);background:rgba(46,204,64,0.05);box-shadow:0 6px 20px rgba(46,204,64,0.15)}
.token-card .ticker{font-size:18px;font-weight:700;color:var(--gold)}
.token-card .name{font-size:13px;color:var(--text);font-weight:600}
.token-card .role{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-top:4px}
.token-card .buy{margin-top:8px;font-size:12px;color:var(--green);font-weight:600}
footer{text-align:center;padding:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:768px){.header-inner{flex-direction:column}nav{justify-content:center;gap:8px}nav a{font-size:11px}.token-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header>
<div class="header-inner">
<div class="logo"><img src="ecodune_logo.png" alt="ECODUNE"><span class="logo-text">ECODUNE</span></div>
<nav>
<a href="index.html">Home</a>
<a href="index.html#token">Token</a>
<a href="ecosystem.html" class="active">Ecosystem</a>
<a href="index.html#fintech">Fintech</a>
<a href="index.html#rwa">RWA</a>
<a href="index.html#trade">Trade</a>
</nav>
<button class="theme-toggle" id="themeToggle">🌙</button>
<a href="https://app.uniswap.org/explore/tokens/solana/BPu5sM2LhYMRRPWajyWesDME8bt6ARpGHWm6Spm6UP9z" target="_blank" class="btn-primary">Trade €ECOD</a>
</div>
</header>

<main class="container">
<div class="section-header">
<h1>ECODUNE <span class="highlight">Ecosystem</span></h1>
<p>40+ tokens across 6 sectors. Every token is clickable and leads to its buy page. All tokens trade with each other.</p>
</div>

<div class="controls">
<input type="text" id="searchInput" placeholder="Search token name or ticker...">
<select id="sectorFilter">
<option value="all">All Sectors</option>
<option value="core">123 Core</option>

<option value="rwa">RWA Bank</option>

<option value="humo">Humo & BYT</option>
<option value="eco">Eco & RWA</option>
</select>
</div>

<div id="sectorsContainer"></div>
</main>

<footer>© 2026 ECODUNE Ecosystem. 40+ tokens. All rights reserved.</footer>

];

const sectorsContainer = document.getElementById('sectorsContainer');
const searchInput = document.getElementById('searchInput');
const sectorFilter = document.getElementById('sectorFilter');

function render(){
  const q = searchInput.value.toLowerCase();
  const filter = sectorFilter.value;
  let html = '';
  sectors.forEach(s => {
    if (filter !== 'all' && filter !== s.id) return;
    const filtered = s.tokens.filter(t =>
      t.name.toLowerCase().includes(q) || t.ticker.toLowerCase().includes(q)
    );
    if (!filtered.length) return;
    html += `<div class="sector-block"><div class="sector-title"><span>${s.icon}</span>${s.title}</div><div class="token-grid">`;
    filtered.forEach(t => {
      html += `<a href="${t.url}" target="_blank" class="token-card">
        <div class="ticker">${t.ticker}</div>
        <div class="name">${t.name}</div>
        <div class="role">${t.role}</div>
        <div class="buy">Buy / View →</div>
      </a>`;
    });
    html += `</div></div>`;
  });
  sectorsContainer.innerHTML = html || '<p style="text-align:center;color:var(--muted);padding:40px">No tokens found.</p>';
}

searchInput.addEventListener('input', render);
sectorFilter.addEventListener('change', render);

const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('ecodune_theme') || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);
themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('ecodune_theme', next);
  themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
});

render();
</script>
</body>
</html>
